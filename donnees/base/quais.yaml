# Quais de la base PHAROS (LAB 8 et suivants). Écrit à la main.
# Les quais 1 à 4 sont ceux de donnees/quai/quais.yaml (LAB 6), à l'identique (test du kit) ;
# pharos-quai continue de lire son propre fichier, qui n'en compte que quatre.
# latitude, longitude : position du poste à quai, en degrés décimaux (WGS 84). Le serveur les
# connaît ; aucun outil ne les prend en paramètre (bloc 16.1).
quais:
