name: preparation
# Rejoue outils/preparer-pc.sh sur un runner Ubuntu 24.04 rendu vierge (sans Docker ni uv),
# comme sur le poste d'un apprenant. Le parcours Windows / WSL se teste à la main.
on:
  push:
    branches: [main]
    paths:
      - outils/preparer-pc.sh
      - PREPARATION.md
      - compose.yaml
      - compose/**
      - images/**
      - Makefile
      - mk/**
      - .github/workflows/preparation.yml
  workflow_dispatch: {}

jobs:
  poste-vierge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CIBLE: ${{ github.workspace }}/../poste/pharos-labs
    steps:
      - uses: actions/checkout@v4

      - name: Rendre le runner vierge (Docker et uv retirés)
        run: |
          sudo systemctl stop docker.socket docker.service containerd.service || true
          sudo apt-get purge -y 'moby-*' 'docker-*' containerd runc || true
          sudo apt-get autoremove -y
          sudo rm -rf /var/lib/docker /var/lib/containerd /etc/docker
          for outil in uv uvx; do
            while command -v "$outil" >/dev/null; do sudo rm -f "$(command -v "$outil")"; hash -r; done
          done
          if command -v docker || command -v uv; then echo "Le runner n'est pas vierge" >&2; exit 1; fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Préparer le poste avec outils/preparer-pc.sh
        # DEPOT pointe sur la copie locale : on teste exactement ce commit, sans clé SSH.
        run: DEPOT="$GITHUB_WORKSPACE" bash outils/preparer-pc.sh

      - name: Vérifier que les outils sont installés
        run: |
          docker --version
          docker compose version
          uv --version
          code --version | head -1

      - name: Démarrer le socle comme un apprenant
        working-directory: ${{ env.CIBLE }}
        run: sg docker -c "make up && make lab0-up"

      - name: Attendre que le serveur soit prêt
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8100/mcp || true)
            case "$code" in
              4??) echo "serveur prêt (code $code)"; exit 0 ;;
            esac
            sleep 2
          done
          echo "serveur toujours indisponible après 60s" >&2
          exit 1

      - name: make doctor
        working-directory: ${{ env.CIBLE }}
        run: sg docker -c "make doctor SANS_MODELE=1"

      - if: failure()
        working-directory: ${{ env.CIBLE }}
        run: sudo docker compose -f compose.yaml -f compose/lab0.yaml logs --tail=200 || true
