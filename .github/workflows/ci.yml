name: ci
on:
  push: {branches: [main, solutions, "etat/**"]}
  pull_request: {}

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.6.12"}
      - run: uv sync --frozen
      - run: uv run pytest -q

  socle:
    runs-on: ubuntu-24.04
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - run: make construire
      - run: make up && make lab0-up
      - name: Attendre que le serveur soit prêt
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8100/mcp || true)
            echo "tentative $i : code $code"
            case "$code" in
              4??) echo "serveur prêt (code $code)"; exit 0 ;;
            esac
            sleep 2
          done
          echo "serveur toujours indisponible après 60s"
          exit 1
      - run: make doctor SANS_MODELE=1
      - if: failure()
        run: docker compose -f compose.yaml -f compose/lab0.yaml logs --tail=200

  solutions:
    # Chaque état de lab, assemblé depuis la branche solutions, doit passer son propre vérificateur.
    if: github.ref == 'refs/heads/solutions'
    runs-on: ubuntu-24.04
    needs: tests
    strategy:
      fail-fast: false
      matrix: {lab: [1, 2, 3, 4, 5, 6, 7]}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: make construire
      - run: python3 -m outils.essayer ${{ matrix.lab }}
      - if: failure()
        run: docker compose -f compose.yaml $(for f in compose/*.yaml; do printf -- '-f %s ' "$f"; done) logs --tail=200
