[project]
name = "pharos-labs"
version = "0.1.0"
description = "Kit des labs de la formation « Créer des agents IA avec MCP » — fil rouge PHAROS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp==4.0.10",
    "httpx>=0.28",
    "pypdf>=5.0",
    "reportlab>=4.2",
    "pyyaml>=6.0",
    "tiktoken>=0.8",
    "watchfiles>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", ".", "client"]
testpaths = ["tests"]
asyncio_mode = "auto"
