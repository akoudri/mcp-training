name: pharos

x-python: &python
  image: pharos/python:2
  build: {context: ., dockerfile: images/python/Dockerfile}
  # Image propre au kit : jamais tirée d'un registre (docker.io n'a pas de pharos/python), construite ici si absente.
  pull_policy: never
  working_dir: /app
  volumes: [".:/app"]
  env_file: [{path: .env, required: false}]
  user: "${PHAROS_UID:-1000}:${PHAROS_GID:-1000}"
  networks: [pharos]

networks:
  pharos: {}

services:
  atelier:
    <<: *python
    profiles: [outils]
    environment:
      CLE_SERVEUR: "${CLE_SERVEUR:-pharos-salle-2026}"
      METEO_URL: http://mocks:8000/meteo
      METEO_CLE: "${METEO_CLE:-meteo-salle-2026}"
      REFERENTIEL_URL: http://mocks:8000/referentiel
      CANAL_URL: http://mocks:8000/canal
      CLE_ETAT: "${CLE_ETAT:-pharos-salle-2026-cle-etat-mrtr-partagee}"

  observateur:
    image: mitmproxy/mitmproxy:${MITMPROXY_VERSION:-12.2.3}
    command: >
      mitmweb --web-host 0.0.0.0 --web-port 8081 --set web_open_browser=false
      --set web_password=pharos --set connection_strategy=lazy
      --mode reverse:http://pharos-docs-demo:8000@8100
      --mode reverse:http://pharos-docs:8000@8101
      --mode reverse:http://pharos-data:8000@8102
      --mode reverse:http://pharos-ops:8000@8103
      --mode reverse:http://pharos-legacy:8000@8104
      --mode reverse:http://pharos-quai:8000@8105
      --mode reverse:http://repartiteur-docs:8000@8201
      --mode reverse:http://repartiteur-ops:8000@8203
      --mode reverse:http://repartiteur-legacy:8000@8204
    # Ports 8101-8105, 8201, 8203 et 8204 réservés aux serveurs et répartiteurs des labs suivants : 502 tant qu'ils n'existent pas.
    # connection_strategy=lazy : le nom du serveur n'est résolu qu'à la requête (sinon mitmproxy coupe la connexion
    # sans réponse HTTP, et la requête n'apparaît pas dans l'observateur).
    # Publié sur 127.0.0.1 seulement : en salle, un voisin ne doit ni lire ce trafic ni joindre ces services.
    # Le LAB 14 exposera explicitement ce qu'il doit exposer.
    ports: ["127.0.0.1:7001:8081", "127.0.0.1:8100-8105:8100-8105", "127.0.0.1:8201:8201", "127.0.0.1:8203:8203", "127.0.0.1:8204:8204"]
    networks: [pharos]
    restart: unless-stopped

  inspector:
    # v2.8.0 n'a plus de port de proxy séparé (pas de 6277) ; DANGEROUSLY_BIND_ALL_INTERFACES est requis pour écouter dans le conteneur ;
    # ALLOWED_ORIGINS est requis à cause du remappage 7002→6274 ; l'absence d'authentification n'est acceptable que parce que le port n'est publié que sur 127.0.0.1.
    image: node:22-slim
    profiles: [outils]
    command: npx -y @modelcontextprotocol/inspector@2.8.0
    environment:
      HOST: "0.0.0.0"
      CLIENT_PORT: "6274"
      DANGEROUSLY_BIND_ALL_INTERFACES: "true"
      DANGEROUSLY_OMIT_AUTH: "true"
      ALLOWED_ORIGINS: "http://localhost:7002,http://127.0.0.1:7002"
    ports: ["127.0.0.1:7002:6274"]
    networks: [pharos]
