services:
  pharos-docs-demo:
    image: pharos/python:1
    working_dir: /app
    volumes: [".:/app"]
    env_file: [{path: .env, required: false}]
    user: "${PHAROS_UID:-1000}:${PHAROS_GID:-1000}"
    networks: [pharos]
    environment:
      VERBEUX: "${VERBEUX:-0}"
      PHAROS_OUTIL_JUMEAU: "${PHAROS_OUTIL_JUMEAU:-0}"
    command: python -m watchfiles --filter python "python -m labs.lab0.serveur.serveur" labs/lab0 src
    restart: unless-stopped
