# Service Python commun des labs, repris par « extends » (voir compose/labN.yaml).
# Dans un sous-dossier exprès : le Makefile charge tous les compose/*.yaml comme surcharges,
# et python-base ne doit pas devenir un service du projet.
# Les chemins relatifs de ce fichier sont résolus depuis ce fichier : ../.. est la racine du dépôt.
services:
  python-base:
    image: pharos/python:2
    build: {context: ../.., dockerfile: images/python/Dockerfile}
    # Image propre au kit : jamais tirée d'un registre, construite ici si absente.
    pull_policy: never
    working_dir: /app
    volumes: ["../..:/app"]
    user: "${PHAROS_UID:-1000}:${PHAROS_GID:-1000}"
    networks: [pharos]
    environment:
      # Clé de signature des handles (LAB 2, 3, 5) : valeur de salle, pas un secret (le LAB 5 la fait tourner).
      CLE_SERVEUR: "${CLE_SERVEUR:-pharos-salle-2026}"
      # Systèmes externes simulés (LAB 10 et suivants), service mocks. La clé météo est une valeur de salle,
      # pas un secret ; elle ne doit pourtant jamais sortir du serveur (LAB 10, bloc 17.1).
      METEO_URL: http://mocks:8000/meteo
      METEO_CLE: "${METEO_CLE:-meteo-salle-2026}"
      REFERENTIEL_URL: http://mocks:8000/referentiel
      CANAL_URL: http://mocks:8000/canal
      # Clé qui scelle le requestState (LAB 12) : partagée par les instances de pharos-ops, au moins 32 octets
      # (le SDK refuse moins). Valeur de salle, pas un secret — comme CLE_SERVEUR, qu'elle ne remplace pas.
      CLE_ETAT: "${CLE_ETAT:-pharos-salle-2026-cle-etat-mrtr-partagee}"
    restart: unless-stopped
