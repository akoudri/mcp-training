services:
  # Service de salle du LAB 14 (poste du formateur). SEUL service ouvert sur le réseau de salle : make
  # salle-demarrer le publie sur 0.0.0.0:8300 ; make salle-locale le garde sur 127.0.0.1 (préparation, tests).
  # profiles: [salle] — il ne démarre pas avec le socle ordinaire, seulement à la demande.
  pharos-salle:
    extends: {file: compose/commun/base.yaml, service: python-base}
    profiles: [salle]
    command: python -m uvicorn serveurs.salle.app:app --host 0.0.0.0 --port 8300 --log-level warning
    ports: ["${SALLE_BIND:-127.0.0.1}:8300:8300"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8300/_sante', timeout=2)"]
      interval: 2s
      retries: 30
